services:
  # --- central decision store -------------------------------------------
  # One process owns the decisions database and serves it to every machine over
  # quack. This exists because a DuckDB file allows exactly one writing process,
  # so pointing three laptops at a shared file deadlocks or corrupts it.
  #
  # Nothing else may open data/db/decisions.duckdb while this runs, not even a
  # read-only script -- it will fail with "Could not set lock on file".
  #
  # quack_serve binds whatever address it is given, so a plain ports: mapping
  # works and network_mode: host is not needed.
  decision-store:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      QUACK_TOKEN: ${QUACK_TOKEN:-hackathon}
    ports:
      - "${QUACK_PORT:-8888}:8888"
    command: ["python", "db/server.py", "--host", "0.0.0.0", "--port", "8888"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "db/cli.py", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Fills in missing vectors. A separate service on purpose: it must not open
  # the database file, so it connects over quack like any other client. It can
  # be down for as long as you like -- rows queue up with embedding NULL and tag
  # search keeps working.
  embedding-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      QUACK_URI: quack://decision-store:8888
      QUACK_TOKEN: ${QUACK_TOKEN:-hackathon}
    command: ["python", "db/worker_embeddings.py"]
    depends_on:
      decision-store:
        condition: service_healthy
    restart: unless-stopped
