services:
  # Long-running context-store API: a small HTTP JSON service in front of
  # DuckDB (db/server.py). Skills reach it as a plain network service at
  # CONTEXT_STORE_URL — they don't run inside this container or touch the
  # DuckDB file directly, so the same skill scripts work whether this is
  # running via this compose stack or on a real remote server.
  context-store:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./data:/app/data
      - ./common:/app/common
      - ./db:/app/db
    ports:
      - "8000:8000"
    command: ["python", "-m", "db.server", "--host", "0.0.0.0", "--port", "8000"]

  # Serves DuckDB's built-in web UI/SQL console (db/serve_ui.py) at
  # http://localhost:4213, for a human to browse the store — separate from
  # the skills' API above, and read-only (context-store holds the one
  # read-write connection while it's running). DuckDB's `ui` extension only
  # binds to 127.0.0.1 inside its own process, so a normal `ports:` mapping
  # wouldn't be reachable from the host — network_mode: host makes the
  # container share the host's network namespace instead. (Linux only; on
  # Docker Desktop for Mac/Windows run `uv run python db/serve_ui.py`
  # directly on the host instead.)
  context-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./data:/app/data
      - ./common:/app/common
      - ./db:/app/db
    network_mode: host
    command: ["python", "db/serve_ui.py", "--port", "4213"]
